<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <!-- Infor product tile: flat Infor Red (#ED0C0C) square with a white
       lowercase "i" drawn as plain geometry. Deliberately free of blur/glow
       effects, gradients, wide-gamut duplicates and any webfont dependency —
       a favicon has to render standalone at 16px. -->
  <rect width="32" height="32" rx="6" fill="#ED0C0C"/>
  <circle cx="16" cy="8.9" r="2.4" fill="#FFFFFF"/>
  <rect x="13.8" y="12.7" width="4.4" height="11.3" rx="1.3" fill="#FFFFFF"/>
</svg>
