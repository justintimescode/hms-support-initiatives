<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>kpi-analyzer</title>
    <script>
      // Pre-paint theme pick so dark mode never flashes light on load.
      // Key must match THEME_KEY in src/lib/theme-mode.js.
      (function () {
        var t = null;
        try { t = localStorage.getItem("kpi.theme"); } catch (e) { /* unavailable */ }
        if (t !== "light" && t !== "dark") {
          t = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches
            ? "dark" : "light";
        }
        document.documentElement.dataset.theme = t;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
